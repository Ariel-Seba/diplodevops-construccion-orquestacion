#####################
# app-saludo ----------------------------------------------
#####################
---
apiVersion: v1
kind: Pod
metadata:
  name: app-saludo-deployment
  namespace: intro-k8s
  labels:
    app: app-saludo
    maintainer: matiops
spec:
  containers:
    - name: app-saludo
      image: matiops/intro-k8s:app-saludo
      ports:
      - containerPort: 8000
        name: web
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: app-saludo-service
  namespace: intro-k8s
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8000
  selector:
    app: app-saludo  
