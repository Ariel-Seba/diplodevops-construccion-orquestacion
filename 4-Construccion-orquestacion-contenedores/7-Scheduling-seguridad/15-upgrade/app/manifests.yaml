apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app-deployment
  template:
    metadata:
      labels:
        app: web-app-deployment
    spec:
      containers:
      - name: flask-app
        image: web-app-deployment:latest
        imagePullPolicy: Never # Importante para usar imágenes locales
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-service
spec:
  type: NodePort
  selector:
    app: web-app-deployment
  ports:
    - port: 8080
      targetPort: 8000
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
  annotations:
    # Esta anotación es clave para que el Nginx Controller la reconozca
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app-service
            port:
              number: 8080