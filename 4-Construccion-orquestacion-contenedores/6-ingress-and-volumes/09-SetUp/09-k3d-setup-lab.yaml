apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: kube-lab
servers: 1
agents: 1

ports:
  - port: 8080:80
    nodeFilters:
      - server:*

# Opcional Mac: persistir datos aun si se elimina el cluster
# volumes:
#  - volume: /Users/tu-usuario/k3d-data:/var/lib/rancher/k3s/storage@all

options:
  k3d:
    wait: true
    timeout: "120s"
    disableLoadbalancer: false